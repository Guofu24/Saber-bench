name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  office:
    name: Agent Office (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent-office
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent-office/package-lock.json
      - name: Install locked viewer build dependencies
        run: npm ci
      - name: Validate snapshots, evidence, HTTP service and viewer behavior
        run: npm test
      - name: Require the committed viewer to match its sources
        run: |
          npm run build:viewer
          git diff --exit-code -- viewer/index.html
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SABER_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - name: Record tested merge and PR revisions
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git log -1 --format='tested=%H%nparents=%P'
          printf 'pr_head=%s\npr_base=%s\n' "$PR_HEAD_SHA" "$PR_BASE_SHA"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.13"
          enable-cache: true
      - name: Install Python from .python-version and locked deps
        run: uv sync --locked --extra analysis
      - name: Validate frozen catalog
        run: uv run python scripts/validate_catalog.py
      - name: Validate operational skills and runtime references (offline)
        run: uv run python scripts/check_skills.py
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Format check
        run: uv run ruff format --check src tests scripts
      - name: Typecheck Linux and Windows APIs
        run: |
          uv run mypy --platform linux
          uv run mypy --platform win32
      - name: Tests (offline only; no lab, no provider keys)
        run: uv run pytest
      - name: Smoke episode (DEV fixture, deterministic)
        run: uv run saber smoke --subtask T1112.001 --seed 42
