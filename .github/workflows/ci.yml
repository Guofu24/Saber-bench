name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SABER_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.13"
          enable-cache: true
      - name: Install Python from .python-version and locked deps
        run: uv sync --locked
      - name: Validate frozen catalog
        run: uv run python scripts/validate_catalog.py
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Typecheck
        run: uv run mypy
      - name: Tests (offline only; no lab, no provider keys)
        run: uv run pytest
      - name: Smoke episode (DEV fixture, deterministic)
        run: uv run saber smoke --subtask T1112.001 --seed 42
