[project]
name = "saber-bench"
version = "0.1.0"
description = "SABER: reproducible SOC benchmark platform (175 NICE-derived subtasks, offline-first)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "pydantic>=2.9,<3",
  "click>=8.1",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[project.scripts]
saber = "saber.cli.main:cli"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-timeout>=2.3",
  "httpx>=0.27",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saber"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["source", "catalog", "scenarios/private"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117"]
"scripts/**" = ["E701", "E702", "E401", "B", "SIM", "UP", "I", "E", "F", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src/saber"]
exclude = ["tests/", "scripts/"]

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider --timeout=300"
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:saber.*"]
markers = [
  "integration: requires an external service (skipped when unavailable)",
  "security: adversarial/negative security tests",
]
