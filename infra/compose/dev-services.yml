# Local DEV services for the M2 lab profile / adapter integration work.
# NOT required for the offline benchmark (default backend is the in-memory FakeEventStore).
# Credentials here are obvious development-only placeholders; never use in a real deployment.
name: saber-dev
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: saber
      POSTGRES_PASSWORD: saber_dev_only_change_me
      POSTGRES_DB: saber
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saber"]
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: saber_dev
      MINIO_ROOT_PASSWORD: saber_dev_only_change_me
    ports: ["9000:9000", "9001:9001"]
  opensearch:
    image: opensearchproject/opensearch:2.16.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"   # dev only; a real lab keeps security on
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
